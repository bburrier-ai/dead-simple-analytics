name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dsa
          POSTGRES_PASSWORD: dsa_dev_password
          POSTGRES_DB: dead_simple_analytics_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dsa -d dead_simple_analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend

      - name: Set up Python
        run: uv python install 3.12
        working-directory: backend

      - name: Install dependencies (frozen + hashed lockfile)
        run: uv sync --frozen --all-groups
        working-directory: backend

      - name: Lint (includes Ruff security rules)
        run: make lint

      - name: Dependency audit (pip-audit)
        run: make audit

      - name: Test
        run: cd backend && uv run pytest -v --cov-report=term-missing
        env:
          APP_ENV: test

      - name: Test deployment watchdog
        run: make test-watchdog

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Bandit
        run: >
          uvx bandit -r backend
          -x backend/tests,backend/.venv,backend/alembic
          -ll

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Semgrep
        run: >
          uvx semgrep scan
          --config p/python
          --config p/security-audit
          --error
          --exclude tests
          --exclude .venv
          backend

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: |
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Run OSV-Scanner
        run: osv-scanner scan source --lockfile=backend/uv.lock
